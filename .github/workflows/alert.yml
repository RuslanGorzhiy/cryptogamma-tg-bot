name: CryptoGamma Telegram Alert

on:
  schedule:
    # каждые 30 минут (UTC). Измените под свои нужды.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send CryptoGamma alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOGAMMA_API_TOKEN: ${{ secrets.CRYPTOGAMMA_API_TOKEN }}
          CRYPTOGAMMA_AUTH_SCHEME: "bearer"
          ALERT_ASSETS: "BTC,ETH"
        run: python alert.py
